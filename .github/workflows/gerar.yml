name: Gerar imagens SeparaGo
on: workflow_dispatch
permissions:
  contents: write
jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gerar carrosseis
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-color-emoji unzip
          python3 -m pip install -q pillow
          curl -sL https://github.com/rsms/inter/releases/download/v4.0/Inter-4.0.zip -o i.zip
          unzip -q i.zip -d inter
          export FONTDIR=$(dirname $(find inter -name Inter-Black.otf | head -1))
          python3 gerar/gerar.py
      - name: Salvar
        run: |
          git config user.name robo-separago
          git config user.email robo@separago.local
          git add midia fila
          git diff --cached --quiet || git commit -m "Gera carrosseis" && git push
