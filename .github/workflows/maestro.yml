name: Maestro dos posts (SeparaGo)

on:
  schedule:
    # Reserva: a cada ~20 min, em minutos fora de :00 e :30. A rodada principal e a cadeia abaixo.
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
    inputs:
      minutos:
        description: "Quantos minutos ficar de plantao (0 = so uma conferencia)"
        default: "50"

permissions:
  contents: write
  actions: write

concurrency:
  group: postar-instagram
  cancel-in-progress: false

jobs:
  maestro:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - name: Maestro (de plantao; publica o que estiver atrasado e chama a proxima rodada)
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: "17841473063846423"
          GH_TOKEN: ${{ github.token }}
          MAESTRO_MINUTOS: ${{ github.event.inputs.minutos || '50' }}
        run: python3 scripts/maestro.py

      - name: Guardar o avanco da fila (rede de seguranca)
        if: always()
        run: |
          git config user.name "robo-separago"
          git config user.email "robo@users.noreply.github.com"
          git add fila/
          git diff --cached --quiet && exit 0
          git commit -m "maestro: atualiza fila"
          for i in 1 2 3 4; do git pull --rebase --autostash && git push && break; sleep 5; done
